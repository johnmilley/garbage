<!doctype html>
<html lang="en" data-edition="site">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garbage Day</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Garbage Day">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f5f2">
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1c1c1c; --muted: #6b6b6b; --line: #e4e2dd;
    --fib: #c9a27a; --fib-ink: #4a3218; --con: #8fd3e0; --con-ink: #0f3d47; --spc: #ffd43b; --spc-ink: #3d3000;
    --accent: #0d74bb;
    --radius: 16px; --tag-radius: 999px; --dot-radius: 50%; --fs: 16px; --head: 34px; --width: 440px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141414; --card: #1f1f1f; --text: #eeeeee; --muted: #9a9a9a; --line: #2e2e2e; --accent: #5aaee8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: var(--fs)/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: var(--width); margin: 0 auto; padding: 24px 16px 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px;
    display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: .94em; font-weight: 600; color: var(--muted); margin: 0 0 6px; text-transform: uppercase; letter-spacing: .04em; }
  .when { font-size: var(--head); font-weight: 750; line-height: 1.1; margin: 0; }
  .date { color: var(--muted); margin: 4px 0 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips.stack { flex-direction: column; align-items: flex-start; }
  .chip { display: inline-flex; align-items: baseline; gap: 8px; padding: 6px 12px; border-radius: var(--tag-radius);
    font-weight: 600; font-size: .875em; border: 1px solid var(--line); color: var(--muted); }
  .chip.big { font-size: 1.3em; padding: 10px 18px; color: var(--text); }
  .chip small { font-size: .7em; font-weight: 500; opacity: .75; }
  .chip.F { background: var(--fib); color: var(--fib-ink); border-color: transparent; }
  .chip.C { background: var(--con); color: var(--con-ink); border-color: transparent; }
  .chip.S { background: var(--spc); color: var(--spc-ink); border-color: transparent; }
  .card.center { text-align: center; }
  .card.center .chips { justify-content: center; align-items: center; }
  .chips:empty, ul:empty { display: none; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 2px; text-align: left; }
  li:not(:first-child) { border-top: 1px solid var(--line); }
  li .d { font-weight: 550; }
  li .t { font-size: .9em; font-weight: 550; text-align: right; }
  li .t small { display: block; font-size: .85em; font-weight: 400; color: var(--muted); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: var(--dot-radius); margin-right: 6px; vertical-align: 0; }
  .dot.F { background: var(--fib); } .dot.C { background: var(--con); }
  footer { margin-top: 18px; font-size: .8em; color: var(--muted); display: grid; gap: 6px; }
  button.link { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; }
  #q { width: 100%; font: inherit; font-size: max(17px, 1.06em); padding: 12px 14px; border-radius: calc(var(--radius) * .75);
    border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .results { margin-top: 8px; display: grid; gap: 4px; }
  .results button { text-align: left; font: inherit; padding: 10px 14px; border-radius: calc(var(--radius) * .6); cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .results button:hover, .results button:focus { border-color: var(--accent); outline: none; }
  .form { gap: 4px; }
  .form h1:not(:first-child) { margin-top: 16px; }
  .form label { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; }
  .form select, .form input[type=number] { font: inherit; padding: 4px 8px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .form input[type=number] { width: 4.5em; }
  .form input[type=range] { width: 45%; accent-color: var(--accent); }
  .form input[type=color] { width: 44px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: none; }
  .form li button { font: inherit; width: 2.2em; padding: 2px 0; margin-left: 4px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .form li button:disabled { opacity: .3; cursor: default; }
  #custom { margin-top: 24px; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <section id="setup" class="hidden">
    <h1>Your address</h1>
    <input id="q" type="search" placeholder="e.g. 12 Main St" autocomplete="off" autocapitalize="characters">
    <div id="results" class="results"></div>
  </section>

  <section id="home" class="hidden">
    <div class="card" id="card">
      <div data-part="head">
        <h1>Next pickup</h1>
        <p class="when" id="when"></p>
        <p class="date" id="date"></p>
      </div>
      <div class="chips" data-part="tags" id="chips"></div>
      <ul data-part="list" id="upcoming"></ul>
    </div>
    <footer>
      <div><span id="addr"></span> · Day <span id="day"></span> · <button class="link" id="change">Change</button> · <button class="link" id="customize">Customize</button></div>
      <div><span id="coverage"></span></div>
      
      <div id="status"></div>
    </footer>
  </section>

  <section id="custom" class="hidden">
    <div class="card form">
      <h1>Colours</h1>
      <div id="colors"></div>
      <h1>Shapes &amp; sizes</h1>
      <label>Corner roundness <input type="range" id="radius" min="0" max="32"></label>
      <label>Badge shape <select id="tag"><option value="pill">Pill</option><option value="rounded">Rounded</option><option value="square">Square</option></select></label>
      <label>Dot shape <select id="dot"><option value="circle">Circle</option><option value="square">Square</option></select></label>
      <label>Text size <input type="range" id="text" min="13" max="24"></label>
      <label>Headline size <input type="range" id="head" min="20" max="64"></label>
      <label>Page width <input type="range" id="width" min="320" max="800" step="20"></label>
      <h1>Arrangement</h1>
      <ul id="order"></ul>
      <label>Recycling &amp; special <select id="stack"><option value="row">Side by side</option><option value="stack">Stacked</option></select></label>
      <label>Alignment <select id="align"><option value="left">Left</option><option value="center">Centred</option></select></label>
      <label>Upcoming dates shown <input type="number" id="count" min="0" max="12"></label>
    </div>
    <footer>
      <div><button class="link" id="done">Done</button> · <button class="link" id="reset">Reset to default</button></div>
    </footer>
  </section>
</main>

<script>
// Garbage goes every pickup day, so only the recycling stream (and any special pickup) is shown.
const TYPES = { F: ['Fibres', 'brown'], C: ['Containers', 'blue'] };
const $ = id => document.getElementById(id);
// Shared copies can't fetch a new schedule. A copy sent as a file ('share') needs a fresh file from its owner;
// the published web app ('site') picks up a new one when the owner republishes it.
const EDITION = document.documentElement.dataset.edition;
const SHARED = EDITION === 'share' || EDITION === 'site';
const ASK = EDITION === 'site' ? 'A new one will show up here once it’s published.' : 'Ask whoever sent you this page for a new copy.';
// Snapshot of the untouched page, used by "Make a copy to share".
const PRISTINE = document.documentElement.cloneNode(true);

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

function lastDate(d) { return Object.values(d.days).flat().map(e => e[0]).sort().pop(); }

let DATA = JSON.parse($('data').textContent);
const saved = store.get('cbg.data');
if (saved && lastDate(saved) > lastDate(DATA)) DATA = saved;

const toISO = dt => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
const fromISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmt = (s, opts) => fromISO(s).toLocaleDateString('en-CA', opts);

function findDay(address) {
  for (const [day, list] of Object.entries(DATA.addr)) if (list.includes(address)) return day;
  return null;
}

// The customize panel sits under the live card so changes can be seen as they're made.
function show(id) {
  for (const s of ['setup', 'home', 'custom']) $(s).classList.toggle('hidden', !(s === id || (id === 'custom' && s === 'home')));
}

// ---- look (colours, shapes, sizes, arrangement) ----
const COLORS = { bg: 'Background', card: 'Card', text: 'Text', muted: 'Faded text', line: 'Lines', accent: 'Links',
  fib: 'Fibres', con: 'Containers', spc: 'Special pickups' };
const PARTS = { head: 'Day & date', tags: 'Recycling', list: 'Upcoming dates' };
const LOOK = { colors: {}, radius: 16, tag: 'pill', dot: 'circle', text: 16, head: 34, width: 440,
  order: ['head', 'tags', 'list'], stack: 'row', align: 'left', count: 5 };
let look = { ...LOOK, ...store.get('cbg.look') };

// Dark or light lettering, whichever reads better on a tag colour.
function ink(hex) {
  const n = parseInt(hex.slice(1), 16);
  return (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255 > 0.6 ? '#1c1c1c' : '#ffffff';
}

function applyLook() {
  const css = document.documentElement.style;
  css.cssText = '';
  for (const [k, v] of Object.entries(look.colors)) {
    css.setProperty('--' + k, v);
    if (['fib', 'con', 'spc'].includes(k)) css.setProperty(`--${k}-ink`, ink(v));
  }
  css.setProperty('--radius', look.radius + 'px');
  css.setProperty('--tag-radius', { pill: '999px', rounded: '6px', square: '0' }[look.tag]);
  css.setProperty('--dot-radius', look.dot === 'square' ? '2px' : '50%');
  css.setProperty('--fs', look.text + 'px');
  css.setProperty('--head', look.head + 'px');
  css.setProperty('--width', look.width + 'px');
  look.order.forEach((p, i) => document.querySelector(`#card [data-part="${p}"]`).style.order = i);
  $('chips').classList.toggle('stack', look.stack === 'stack');
  $('card').classList.toggle('center', look.align === 'center');
}

function saveLook() { store.set('cbg.look', look); applyLook(); render(); }

function showCustom() {
  show('custom');
  const cs = getComputedStyle(document.documentElement);
  $('colors').innerHTML = '';
  for (const [k, name] of Object.entries(COLORS)) {
    const label = document.createElement('label');
    const input = document.createElement('input');
    input.type = 'color';
    input.value = cs.getPropertyValue('--' + k).trim();
    input.oninput = () => { look.colors = { ...look.colors, [k]: input.value }; saveLook(); };
    label.append(name, input);
    $('colors').appendChild(label);
  }
  for (const k of ['radius', 'tag', 'dot', 'text', 'head', 'width', 'stack', 'align', 'count']) $(k).value = look[k];
  renderOrder();
}

for (const k of ['radius', 'tag', 'dot', 'text', 'head', 'width', 'stack', 'align', 'count']) {
  $(k).addEventListener('input', () => {
    const el = $(k);
    if (el.type === 'number' || el.type === 'range') {
      if (el.value === '') return;
      look[k] = Math.max(+el.min, Math.min(+el.max, Number(el.value)));
    } else look[k] = el.value;
    saveLook();
  });
}

function renderOrder() {
  $('order').innerHTML = '';
  look.order.forEach((p, i) => {
    const li = document.createElement('li');
    const btns = document.createElement('span');
    for (const [label, to] of [['↑', i - 1], ['↓', i + 1]]) {
      const b = document.createElement('button');
      b.textContent = label;
      b.setAttribute('aria-label', `Move ${PARTS[p]} ${label === '↑' ? 'up' : 'down'}`);
      b.disabled = to < 0 || to >= look.order.length;
      b.onclick = () => {
        const order = [...look.order];
        [order[i], order[to]] = [order[to], order[i]];
        look.order = order;
        saveLook();
        renderOrder();
      };
      btns.appendChild(b);
    }
    li.append(PARTS[p], btns);
    $('order').appendChild(li);
  });
}

$('customize').onclick = showCustom;
$('done').onclick = () => { show('home'); render(); };
$('reset').onclick = () => { look = { ...LOOK }; store.set('cbg.look', null); applyLook(); showCustom(); };

}

$('q').addEventListener('input', () => {
  const words = $('q').value.toUpperCase().trim().split(/\s+/).filter(Boolean);
  const out = $('results');
  out.innerHTML = '';
  if (!words.length) return;
  const hits = [];
  for (const [day, list] of Object.entries(DATA.addr)) {
    for (const a of list) {
      if (words.every(w => a.split(' ').some(p => p.startsWith(w)))) hits.push([a, day]);
    }
  }
  hits.sort((x, y) => x[0].localeCompare(y[0], undefined, { numeric: true }));
  for (const [a, day] of hits.slice(0, 10)) {
    const b = document.createElement('button');
    b.textContent = a;
    b.onclick = () => { store.set('cbg.home', { address: a, day }); render(); };
    out.appendChild(b);
  }
  if (!hits.length) out.textContent = 'No match.';
});

// ---- home ----
function render() {
  const home = store.get('cbg.home');
  if (!home) return showSetup();
  if ($('home').classList.contains('hidden')) show('home');

  const today = toISO(new Date());
  const tomorrow = toISO(new Date(Date.now() + 864e5));
  const upcoming = (DATA.days[home.day] || []).filter(e => e[0] >= today);
  const end = lastDate(DATA);

  $('addr').textContent = home.address;
  $('day').textContent = home.day;
  $('coverage').textContent = 'Schedule to ' + fmt(end, { month: 'short', day: 'numeric', year: 'numeric' });
  if (SHARED && (fromISO(end) - fromISO(today)) / 864e5 < 21) {
    $('status').textContent = 'This schedule is almost over. ' + ASK;
  }

  if (!upcoming.length) {
    $('when').textContent = 'No dates left';
    $('date').textContent = SHARED ? ASK : 'Tap “Check for new schedule” below.';
    $('chips').innerHTML = '';
    $('upcoming').innerHTML = '';
    return;
  }

  const [next, type, special] = upcoming[0];
  const soon = next === today ? 'Today' : next === tomorrow ? 'Tomorrow' : '';
  $('when').textContent = soon || fmt(next, { weekday: 'long' });
  $('date').textContent = fmt(next, soon ? { weekday: 'long', month: 'long', day: 'numeric' } : { month: 'long', day: 'numeric' });
  $('chips').innerHTML = '';
  const chip = (cls, text, sub) => {
    const s = document.createElement('span');
    s.className = 'chip ' + cls;
    s.textContent = text;
    if (sub) { const sm = document.createElement('small'); sm.textContent = sub; s.appendChild(sm); }
    $('chips').appendChild(s);
  };
  if (type) chip(type + ' big', TYPES[type][0], TYPES[type][1]);
  else chip('big', 'No recycling');
  if (special) chip('S', special);

  $('upcoming').innerHTML = '';
  for (const [d, t, s] of upcoming.slice(1, 1 + look.count)) {
    const li = document.createElement('li');
    li.innerHTML = '<span class="d"></span><span class="t"></span>';
    li.querySelector('.d').textContent = fmt(d, { weekday: 'short', month: 'short', day: 'numeric' });
    const tEl = li.querySelector('.t');
    if (t) { const dot = document.createElement('span'); dot.className = 'dot ' + t; tEl.appendChild(dot); }
    tEl.append(t ? TYPES[t][0] : 'No recycling');
    if (s) { const sm = document.createElement('small'); sm.textContent = s; tEl.appendChild(sm); }
    $('upcoming').appendChild(li);
  }
}

$('change').onclick = showSetup;

applyLook();
render();
</script>

<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
